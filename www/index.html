<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sky Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #d8b25c;
    position: fixed; inset: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #fff;
    user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #cv { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: block; touch-action: none; background: #d8b25c; }

  /* HUD */
  #hud { position: fixed; inset: 0; display: none; flex-direction: column;
    justify-content: space-between; pointer-events: none; padding: 16px; z-index: 5; }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { min-height: 42px; background: linear-gradient(145deg, rgba(14,32,58,.88), rgba(7,15,31,.72));
    border: 1px solid rgba(126,190,255,.28); border-radius: 14px; padding: 8px 12px; font-size: 14px; font-weight: 800;
    box-shadow: 0 8px 24px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.08);
    backdrop-filter: blur(12px); display: flex; align-items: center; gap: 7px; }
  .chip small { font-weight: 700; opacity: .55; font-size: 9px; letter-spacing: 1px; }
  .chip.metric { flex-direction: column; align-items: flex-start; gap: 1px; min-width: 70px; }
  #lives { color: #ff5a6e; letter-spacing: 2px; font-size: 16px; }
  #score { color: #ffd84a; }
  #starcount { color: #ffcc22; }

  .bars { flex: 1; display: flex; flex-direction: column; gap: 8px; max-width: 390px; width: min(100%, 390px); margin: 0 auto; justify-content: flex-end; padding-bottom: 8px; }
  .bar { background: linear-gradient(145deg, rgba(12,27,51,.88), rgba(7,14,29,.72)); border: 1px solid rgba(126,190,255,.25);
    border-radius: 14px; padding: 9px 11px; box-shadow: 0 10px 24px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.07); backdrop-filter: blur(12px); }
  .bar .top { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; margin-bottom: 7px; opacity: .9; text-transform: uppercase; letter-spacing: .8px; }
  .bar .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .top span:last-child { flex: 0 0 auto; }
  .track { height: 10px; background: rgba(2,8,20,.75); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .track > i { display: block; height: 100%; border-radius: 6px; transition: width .2s; }
  #hpfill { background: linear-gradient(90deg,#ff4e70,#ff9d4d 62%,#ffe27b); box-shadow: 0 0 12px rgba(255,91,104,.6); }
  #mfill { background: linear-gradient(90deg,#4a8dff,#4ad0ff 55%,#64f5c2); box-shadow: 0 0 12px rgba(74,208,255,.55); }

  #pauseBtn { pointer-events: auto; cursor: pointer; }

  /* Overlay menus */
  #overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; padding: 20px;
    background: radial-gradient(ellipse at 50% 30%, rgba(40,60,120,.35), rgba(5,8,18,.85)); }
  .panel { background: rgba(14,20,38,.92); border: 1px solid rgba(120,160,255,.3);
    border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .panel.wide { max-width: 440px; }
  .panel h1 { font-size: 42px; letter-spacing: 3px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(80,160,255,.6); }
  .panel h1 span { color: #4ad0ff; }
  .panel h2 { font-size: 26px; margin-bottom: 8px; }
  .panel h2.bad { color: #ff5a6e; }
  .panel .sub { opacity: .75; font-size: 14px; margin-bottom: 20px; }
  .panel .hint { opacity: .5; font-size: 12px; margin-top: 16px; line-height: 1.5; }
  .btn { display: block; width: 100%; margin: 10px 0 0; padding: 14px; font-size: 16px;
    font-weight: 700; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(90deg,#3a7bff,#4ad0ff); color: #fff; transition: transform .1s, filter .1s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.08); border: 1px solid rgba(120,160,255,.3); }
  .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .stats > div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px 18px; min-width: 90px; }
  .stats span { display: block; font-size: 12px; opacity: .6; margin-bottom: 4px; }
  .stats b { font-size: 24px; color: #ffd84a; }

  .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 18px; }
  .mcell { aspect-ratio: 1; border-radius: 12px; border: 1px solid rgba(120,160,255,.3);
    background: linear-gradient(160deg, rgba(60,100,200,.35), rgba(30,40,80,.5));
    color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; padding: 4px; transition: transform .1s; }
  .mcell:hover { transform: scale(1.06); }
  .mcell.locked { background: rgba(255,255,255,.04); color: #556; cursor: not-allowed; opacity: .6; }
  .mcell .mnum { font-size: 20px; font-weight: 800; }
  .mcell .mname { font-size: 8px; line-height: 1.1; opacity: .8; text-align: center; }

  /* Toast */
  #toast { position: fixed; top: 22%; left: 50%; transform: translate(-50%, -20px);
    background: rgba(14,20,38,.9); border: 1px solid rgba(120,160,255,.4); border-radius: 14px;
    padding: 12px 22px; text-align: center; z-index: 15; opacity: 0; transition: all .3s;
    pointer-events: none; min-width: 200px; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast b { display: block; font-size: 17px; color: #4ad0ff; }
  #toast span { font-size: 13px; opacity: .8; }

  /* Shop / Hangar / Upgrades */
  .wallet { font-size: 16px; font-weight: 800; color: #ffd84a; margin: -4px 0 14px; }
  .menu2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .menu2 .btn { margin: 0; }
  .panel.wide { max-width: 460px; max-height: 88vh; overflow-y: auto; }
  .shopgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 16px; }
  .scell { background: rgba(255,255,255,.05); border: 1px solid rgba(120,160,255,.25); border-radius: 14px;
    padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .scell.on { border-color: #4ad0ff; box-shadow: 0 0 0 2px rgba(74,208,255,.3) inset; }
  .pprev { width: 56px; height: 70px; object-fit: contain; image-rendering: auto; }
  .pbig { width: 120px; height: 150px; object-fit: contain; display: block; margin: 0 auto 4px; }
  .pn { font-size: 13px; font-weight: 700; }
  .pn.big { font-size: 20px; }
  .pr { font-size: 10px; opacity: .7; text-transform: uppercase; letter-spacing: .5px; color: #ffcf6a; }
  .pstats { font-size: 10px; opacity: .6; margin-bottom: 4px; }
  .mini { border: none; border-radius: 9px; padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    background: linear-gradient(90deg,#3a7bff,#4ad0ff); color: #fff; }
  .mini.equip { background: rgba(255,255,255,.14); }
  .mini.buy.dis { background: #555b66; opacity: .6; }
  .mini.on { background: #4ad0ff; color: #06243a; }
  .tag.eq { font-size: 11px; font-weight: 800; color: #4affa6; padding: 6px 0; }
  .statbars { margin: 10px 0; }
  .sb { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .sb i { height: 8px; background: linear-gradient(90deg,#4ad0ff,#4affa6); border-radius: 5px; display: block; }
  .sb b { text-align: right; color: #ffd84a; }
  .ownedrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .uplist { margin: 10px 0 16px; }
  .urow { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 8px; margin: 8px 0; }
  .ul { font-size: 13px; font-weight: 700; text-align: left; }
  .pips { display: flex; gap: 3px; }
  .pips i { flex: 1; height: 8px; background: rgba(255,255,255,.15); border-radius: 3px; }
  .pips i.f { background: linear-gradient(90deg,#4ad0ff,#4affa6); }

  /* Splash */
  .splash { text-align: center; }
  .splashplane { width: 90px; height: 112px; object-fit: contain; animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
  .splashtitle { font-size: 46px; letter-spacing: 4px; margin: 6px 0 14px; text-shadow: 0 0 22px rgba(80,160,255,.7); }
  .splashtitle span { color: #4ad0ff; }
  .splashbar { width: 180px; height: 6px; background: rgba(255,255,255,.15); border-radius: 4px; margin: 0 auto; overflow: hidden; }
  .splashbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#3a7bff,#4ad0ff); animation: load 2.2s ease forwards; }
  @keyframes load { to { width: 100%; } }
  .splashsub { margin-top: 12px; opacity: .6; font-size: 13px; animation: blink 1.2s step-start infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (max-width: 560px) {
    #hud { padding: 10px; }
    .hud-row { gap: 5px; }
    .chip { min-height: 38px; padding: 6px 8px; font-size: 12px; border-radius: 12px; }
    .chip.metric { min-width: 56px; }
    #lives { padding-inline: 9px; font-size: 14px; }
    .bars { padding-bottom: 2px; }
  }

  .brief { width: 100%; max-height: 42vh; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
  .credits { position: fixed; inset: 0; background: #050812; overflow: hidden; text-align: center; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; }
  .roll { position: absolute; inset: 0 20px; animation: roll 30s linear forwards; font-size: 18px; }
  .roll p { margin: 44px 0; } .roll h1 span { color: #4ad0ff; }
  @keyframes roll { from { transform: translateY(100vh); } to { transform: translateY(-110%); } }
  .credits .btn { position: relative; }
  /* Daily */
  .dot { color: #4affa6; }
  .ghostdis { background: #555b66 !important; opacity: .7; }
  .dailygrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 16px; }
  .dcell { position: relative; background: rgba(255,255,255,.05); border: 1px solid rgba(120,160,255,.25);
    border-radius: 12px; padding: 10px 4px; }
  .dcell .dd { font-size: 11px; opacity: .7; }
  .dcell .dr { font-size: 13px; font-weight: 800; color: #ffd84a; margin-top: 3px; }
  .dcell.today { border-color: #4ad0ff; box-shadow: 0 0 0 2px rgba(74,208,255,.3) inset; }
  .dcell.claimed { opacity: .5; }
  .dcell .dok { position: absolute; top: 4px; right: 6px; color: #4affa6; font-weight: 800; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="chip" id="lives">❤❤❤</div>
      <div class="chip metric"><small>SCORE</small> <span id="score">0</span></div>
      <div class="chip metric"><small>⭐ STARS</small> <span id="starcount">0</span></div>
      <div class="chip metric"><small>🪙 COINS</small> <span id="coincount">0</span></div>
      <div class="chip" id="bombBtn" style="pointer-events:auto;cursor:pointer">💣 1</div>
      <div class="chip" id="pauseBtn">⏸</div>
    </div>
    <div class="bars">
      <div class="bar">
        <div class="top"><span id="mtitle">Mission</span><span id="mprog">0 / 0</span></div>
        <div class="track"><i id="mfill" style="width:0%"></i></div>
      </div>
      <div class="bar">
        <div class="top"><span>POWER CORE ⚡</span><span><b id="hpvalue">20%</b> · <span id="powerlvl">Lv 1</span></span></div>
        <div class="track"><i id="hpfill" style="width:20%"></i></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="overlay"></div>

  <script src="js/missions.js"></script>
  <script src="js/data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game2d.js"></script>
</body>
</html>
