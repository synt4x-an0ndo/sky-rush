<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SkyForce 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #fff;
    user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; }

  /* HUD */
  #hud { position: fixed; inset: 0; display: none; flex-direction: column;
    justify-content: space-between; pointer-events: none; padding: 14px; z-index: 5; }
  .hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .chip { background: rgba(10,16,32,.55); border: 1px solid rgba(120,160,255,.25);
    border-radius: 12px; padding: 7px 12px; font-size: 14px; font-weight: 700;
    backdrop-filter: blur(6px); display: flex; align-items: center; gap: 6px; }
  .chip small { font-weight: 500; opacity: .6; font-size: 11px; }
  #lives { color: #ff5a6e; letter-spacing: 2px; font-size: 16px; }
  #score { color: #ffd84a; }
  #starcount { color: #ffcc22; }

  .bars { flex: 1; display: flex; flex-direction: column; gap: 6px; max-width: 340px; margin: 0 auto; }
  .bar { background: rgba(10,16,32,.6); border: 1px solid rgba(120,160,255,.25);
    border-radius: 10px; padding: 5px 8px; }
  .bar .top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; opacity: .85; }
  .track { height: 8px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 6px; transition: width .2s; }
  #hpfill { background: linear-gradient(90deg,#ff5a6e,#ffa64a); }
  #mfill { background: linear-gradient(90deg,#4ad0ff,#4affa6); }

  #pauseBtn { pointer-events: auto; cursor: pointer; }

  /* Overlay menus */
  #overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; padding: 20px;
    background: radial-gradient(ellipse at 50% 30%, rgba(40,60,120,.35), rgba(5,8,18,.85)); }
  .panel { background: rgba(14,20,38,.92); border: 1px solid rgba(120,160,255,.3);
    border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .panel.wide { max-width: 440px; }
  .panel h1 { font-size: 42px; letter-spacing: 3px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(80,160,255,.6); }
  .panel h1 span { color: #4ad0ff; }
  .panel h2 { font-size: 26px; margin-bottom: 8px; }
  .panel h2.bad { color: #ff5a6e; }
  .panel .sub { opacity: .75; font-size: 14px; margin-bottom: 20px; }
  .panel .hint { opacity: .5; font-size: 12px; margin-top: 16px; line-height: 1.5; }
  .btn { display: block; width: 100%; margin: 10px 0 0; padding: 14px; font-size: 16px;
    font-weight: 700; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(90deg,#3a7bff,#4ad0ff); color: #fff; transition: transform .1s, filter .1s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.08); border: 1px solid rgba(120,160,255,.3); }
  .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .stats > div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px 18px; min-width: 90px; }
  .stats span { display: block; font-size: 12px; opacity: .6; margin-bottom: 4px; }
  .stats b { font-size: 24px; color: #ffd84a; }

  .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 18px; }
  .mcell { aspect-ratio: 1; border-radius: 12px; border: 1px solid rgba(120,160,255,.3);
    background: linear-gradient(160deg, rgba(60,100,200,.35), rgba(30,40,80,.5));
    color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; padding: 4px; transition: transform .1s; }
  .mcell:hover { transform: scale(1.06); }
  .mcell.locked { background: rgba(255,255,255,.04); color: #556; cursor: not-allowed; opacity: .6; }
  .mcell .mnum { font-size: 20px; font-weight: 800; }
  .mcell .mname { font-size: 8px; line-height: 1.1; opacity: .8; text-align: center; }

  /* Toast */
  #toast { position: fixed; top: 22%; left: 50%; transform: translate(-50%, -20px);
    background: rgba(14,20,38,.9); border: 1px solid rgba(120,160,255,.4); border-radius: 14px;
    padding: 12px 22px; text-align: center; z-index: 15; opacity: 0; transition: all .3s;
    pointer-events: none; min-width: 200px; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast b { display: block; font-size: 17px; color: #4ad0ff; }
  #toast span { font-size: 13px; opacity: .8; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="chip" id="lives">❤❤❤</div>
      <div class="chip"><small>SCORE</small> <span id="score">0</span></div>
      <div class="chip"><small>⭐</small> <span id="starcount">0</span></div>
      <div class="chip" id="pauseBtn">⏸</div>
    </div>
    <div class="bars">
      <div class="bar">
        <div class="top"><span id="mtitle">Mission</span><span id="mprog">0 / 0</span></div>
        <div class="track"><i id="mfill" style="width:0%"></i></div>
      </div>
      <div class="bar">
        <div class="top"><span>HULL</span></div>
        <div class="track"><i id="hpfill" style="width:100%"></i></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="overlay"></div>

  <script src="js/missions.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game2d.js"></script>
</body>
</html>
